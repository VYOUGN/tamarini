<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تماريني</title>
<meta name="description" content="جدول تمارين النادي، وتسجيل الجولات، وتقدّم الأوزان. يشتغل بدون إنترنت.">
<meta name="theme-color" content="#15171A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تماريني">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="band">
  <div class="band-in">
    <button id="back" class="back" type="button" aria-label="رجوع" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <div class="titles">
      <h1 id="title">تماريني</h1>
      <p id="subtitle"></p>
    </div>
    <button id="syncDot" class="sync-dot" type="button" data-s="off"><i></i><span id="syncDotText">النسخ</span></button>
  </div>
</header>

<main id="main" class="main"></main>

<nav id="tabs" class="tabs" aria-label="الأقسام">
  <button type="button" data-tab="today">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4M21 10v4M6 7v10M18 7v10M6 12h12"/></svg>
    <span>اليوم</span>
  </button>
  <button type="button" data-tab="plan">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>الجدول</span>
  </button>
  <button type="button" data-tab="progress">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M5 15l4-4 3 3 7-7"/><path d="M15 7h4v4"/></svg>
    <span>التقدّم</span>
  </button>
  <button type="button" data-tab="log">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>
    <span>السجل</span>
  </button>
</nav>

<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
